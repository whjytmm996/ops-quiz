name: Publish v76 to gh-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gh-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify or restore v76 single-file app
        run: |
          set -euo pipefail
          HASH='28a4f478b8e7ccc4d040ceb013c0f058d3f23ead8361c8f891c0c32d5ebc9908'
          if [ -f index.html ] && echo "$HASH  index.html" | sha256sum -c - >/dev/null 2>&1; then
            echo 'existing index.html already matches v76'
          else
            curl -fL --retry 3 --retry-delay 2 -o index.html "https://aka.doubaocdn.com/s/30vRfPIykI"
          fi
          echo "$HASH  index.html" | sha256sum -c -
      - name: Persist imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: import v76 single-file app"
            git push
          fi
      - name: Publish gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf --cached .
          git add -f index.html .nojekyll
          git commit -m "deploy: v76 pages"
          git push --force origin gh-pages
